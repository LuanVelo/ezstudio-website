<!--
  tags.html — Componente Tag / Badge
  Figma node: 3-713
  Variantes: header, header-inverted, white, black, ghost, ghost-inverted
-->

<!-- Tag Header (padrão — fundo cinza claro, com dot) -->
<span class="tag tag--header">
  <span class="tag__indicator" aria-hidden="true"></span>
  <span class="tag__text">Text goes here</span>
</span>

<!-- Tag Header Inverted (fundo escuro, com dot) -->
<span class="tag tag--header-inverted">
  <span class="tag__indicator" aria-hidden="true"></span>
  <span class="tag__text">Text goes here</span>
</span>

<!-- Tag White (fundo branco, sem dot) -->
<span class="tag tag--white">
  <span class="tag__text">00</span>
</span>

<!-- Tag Black (fundo escuro médio, sem dot) -->
<span class="tag tag--black">
  <span class="tag__text">00</span>
</span>

<!-- Tag Ghost (outlined border muted, sem dot) -->
<span class="tag tag--ghost">
  <span class="tag__text">text goes here</span>
</span>

<!-- Tag Ghost Inverted (outlined branco — usar sobre fundos escuros) -->
<span class="tag tag--ghost-inverted">
  <span class="tag__text">text goes here</span>
</span>
