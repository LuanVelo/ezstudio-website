<!--
  section-title.html — ezstudio
  Componente: Section Title
  Figma node: 9-1448 · variantes: centered / 1col / 2col
  CSS: assets/css/components.css → .section-title

  VARIANTES:
    .section-title--centered  — tag + título + subtítulo centrados (máx 500px)
    .section-title--1col      — tag + título + subtítulo alinhados à esquerda
    .section-title--2col      — tag + título + subtítulo à esquerda + CTA à direita

  USO:
    Inserir dentro de uma <section> com .container ou padding lateral.
    Substituir textos de placeholder pelas cópias reais de cada página.
-->


<!-- ── Variante: Centered ── -->
<div class="section-title section-title--centered">
  <span class="tag tag--header">
    <span class="tag__indicator"></span>
    <span class="tag__text">Who we are</span>
  </span>
  <div class="section-title__titles">
    <h2 class="section-title__heading">Title H2 here</h2>
    <p class="section-title__sub">This includes structure, interface and implementation.</p>
  </div>
</div>


<!-- ── Variante: 1 column (alinhamento esquerda, sem CTA) ── -->
<div class="section-title section-title--1col">
  <div class="section-title__left">
    <span class="tag tag--header">
      <span class="tag__indicator"></span>
      <span class="tag__text">Text goes here</span>
    </span>
    <div class="section-title__titles">
      <h2 class="section-title__heading">Title H2 here</h2>
      <p class="section-title__sub">Case studies that highlight our process and results</p>
    </div>
  </div>
</div>


<!-- ── Variante: 2 columns (alinhamento esquerda + CTA à direita) ── -->
<div class="section-title section-title--2col">
  <div class="section-title__left">
    <span class="tag tag--header">
      <span class="tag__indicator"></span>
      <span class="tag__text">Text goes here</span>
    </span>
    <div class="section-title__titles">
      <h2 class="section-title__heading">Title H2 here</h2>
      <p class="section-title__sub">Case studies that highlight our process and results</p>
    </div>
  </div>

  <a class="cta-destaque section-title__cta" href="contact.html">
    <div class="cta-destaque__top">
      <span class="cta-destaque__label">Start project</span>
      <span class="cta-destaque__icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 9H16M16 9L9 2M16 9L9 16" stroke="#1d2029" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </div>
    <div class="cta-destaque__indicator" aria-hidden="true">
      <span class="cta-destaque__dot"></span>
      <span class="cta-destaque__line-wrap">
        <span class="cta-destaque__line"></span>
      </span>
    </div>
  </a>
</div>
