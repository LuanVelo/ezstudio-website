<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preview — CTA Destaque</title>
  <link rel="stylesheet" href="../assets/css/design-system.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    body { padding: 80px 60px; background: #f2f4f7; }
    .preview-row { display: flex; gap: 80px; align-items: flex-start; flex-wrap: wrap; }
    .preview-label { font-size: 11px; color: #888; margin-bottom: 16px; font-family: monospace; }
    .bg-dark { background: #1d2029; padding: 40px; border-radius: 12px; }
  </style>
</head>
<body>

  <div class="preview-row">

    <!-- Fundo claro -->
    <div>
      <p class="preview-label">fundo claro — hover para ver animação</p>
      <a class="cta-destaque" href="#">
        <div class="cta-destaque__top">
          <span class="cta-destaque__label">Start project</span>
          <span class="cta-destaque__icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 9H16M16 9L9 2M16 9L9 16" stroke="#1d2029" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </div>
        <div class="cta-destaque__indicator">
          <span class="cta-destaque__dot"></span>
          <span class="cta-destaque__line-wrap">
            <span class="cta-destaque__line"></span>
          </span>
        </div>
      </a>
    </div>

    <!-- Fundo escuro (variante invertida) -->
    <div>
      <p class="preview-label">fundo escuro</p>
      <div class="bg-dark">
        <a class="cta-destaque cta-destaque--inverted" href="#">
          <div class="cta-destaque__top">
            <span class="cta-destaque__label">Start project</span>
            <span class="cta-destaque__icon">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 9H16M16 9L9 2M16 9L9 16" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </div>
          <div class="cta-destaque__indicator">
            <span class="cta-destaque__dot"></span>
            <span class="cta-destaque__line-wrap">
              <span class="cta-destaque__line"></span>
            </span>
          </div>
        </a>
      </div>
    </div>

  </div>

</body>
</html>
